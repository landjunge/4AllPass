name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel outdated runs on the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:webauthn
      - run: npm run typecheck
      - run: node scripts/verify-aes-gcm-vectors.mjs
      - name: Reproducible PWA and extension builds
        env:
          SOURCE_DATE_EPOCH: "0"
        run: npm run verify:reproducible
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  rust-supply-chain:
    name: Cargo lock + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Lockfile matches Cargo.toml
        run: cargo fetch --locked
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  desktop-stall:
    name: Desktop sleep stall
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Wall-clock stall (not Instant)
        run: rustc --edition 2021 --test src-tauri/src/sleep_stall.rs -o sleep-stall && ./sleep-stall
      - name: Sidecar bind is not foreign-port trust
        run: rustc --edition 2021 --test src-tauri/src/core_bind.rs -o core-bind && ./core-bind

  python:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fourallpass
          POSTGRES_PASSWORD: fourallpass
          POSTGRES_DB: fourallpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fourallpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FOURALLPASS_TEST_DATABASE_URL: postgresql+asyncpg://fourallpass:fourallpass@localhost:5432/fourallpass_test
      FOURALLPASS_MIGRATIONS_TEST_DATABASE_URL: postgresql+asyncpg://fourallpass:fourallpass@localhost:5432/fourallpass_migrations_test
      FOURALLPASS_DATABASE_URL: postgresql+asyncpg://fourallpass:fourallpass@localhost:5432/fourallpass_test
      FOURALLPASS_SESSION_BACKEND: memory
      FOURALLPASS_SESSION_SECRET: ci-session-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            scripts/requirements-dev.txt
      - name: Create test databases
        env:
          PGPASSWORD: fourallpass
        run: |
          psql -h localhost -U fourallpass -d fourallpass -c "CREATE DATABASE fourallpass_test;"
          psql -h localhost -U fourallpass -d fourallpass -c "CREATE DATABASE fourallpass_migrations_test;"
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Install vector-script deps
        run: pip install -r scripts/requirements-dev.txt
      - name: Pytest
        working-directory: backend
        run: pytest
      - name: Argon2id vector check
        run: python3 scripts/verify-argon2id-vectors.py
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r backend/requirements.txt

  python-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOURALLPASS_SESSION_BACKEND: memory
      FOURALLPASS_SESSION_SECRET: ci-session-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Pytest (SQLite default)
        working-directory: backend
        run: pytest
