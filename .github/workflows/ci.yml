name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel outdated runs on the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify Pages archive
        run: |
          bash scripts/package-pages.sh site "$RUNNER_TEMP/pages-policy-check.tar"
          tar -tf "$RUNNER_TEMP/pages-policy-check.tar" > "$RUNNER_TEMP/pages-policy-check.list"
          grep -Fxq './index.html' "$RUNNER_TEMP/pages-policy-check.list"
      - run: npm ci
      - run: npm test
      - run: npm run test:webauthn
      - run: npm run typecheck
      - run: npm run lint -w @4allpass/frontend
      - run: node scripts/verify-aes-gcm-vectors.mjs
      - name: Reproducible PWA and extension builds
        env:
          SOURCE_DATE_EPOCH: "0"
        run: npm run verify:reproducible
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  rust-supply-chain:
    name: Cargo lock + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Lockfile matches Cargo.toml
        run: cargo fetch --locked
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-cyclonedx
      - name: pip-audit
        run: pip install pip-audit
      - name: Generate CycloneDX SBOMs
        run: bash scripts/generate-sbom.sh sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  desktop-stall:
    # Pure-function guards that need no Tauri build. The wall-clock stall test
    # is gone with sleep_stall.rs: sleep now locks on the OS notification, so
    # certifying the rejected clock heuristic certified nothing we ship.
    name: Desktop unit guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Sidecar bind is not foreign-port trust
        run: rustc --edition 2021 --test src-tauri/src/core_bind.rs -o core-bind && ./core-bind
      - name: Loopback process inspect parsers
        run: rustc --edition 2021 --test src-tauri/src/process_inspect.rs -o process-inspect && ./process-inspect
      - name: Temporary browser copies never overwrite link targets
        run: rustc --edition 2021 --test src-tauri/src/secret_fs.rs -o secret-fs && ./secret-fs

  python:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fourallpass
          POSTGRES_PASSWORD: fourallpass
          POSTGRES_DB: fourallpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fourallpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FOURALLPASS_TEST_DATABASE_URL: postgresql+asyncpg://fourallpass:fourallpass@localhost:5432/fourallpass_test
      FOURALLPASS_MIGRATIONS_TEST_DATABASE_URL: postgresql+asyncpg://fourallpass:fourallpass@localhost:5432/fourallpass_migrations_test
      FOURALLPASS_DATABASE_URL: postgresql+asyncpg://fourallpass:fourallpass@localhost:5432/fourallpass_test
      FOURALLPASS_SESSION_BACKEND: memory
      FOURALLPASS_SESSION_SECRET: ci-session-secret-not-for-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            scripts/requirements-dev.txt
      - name: Create test databases
        env:
          PGPASSWORD: fourallpass
        run: |
          psql -h localhost -U fourallpass -d fourallpass -c "CREATE DATABASE fourallpass_test;"
          psql -h localhost -U fourallpass -d fourallpass -c "CREATE DATABASE fourallpass_migrations_test;"
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Install vector-script deps
        run: pip install -r scripts/requirements-dev.txt
      - name: Pytest
        working-directory: backend
        run: pytest
      - name: Argon2id vector check
        run: python3 scripts/verify-argon2id-vectors.py
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r backend/requirements.txt

  python-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOURALLPASS_SESSION_BACKEND: memory
      FOURALLPASS_SESSION_SECRET: ci-session-secret-not-for-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Pytest (SQLite default)
        working-directory: backend
        run: pytest
      - name: Protected executor contract (no real credentials)
        run: python -m pytest -q protected_executor/tests/test_core.py protected_executor/tests/test_binding.py
