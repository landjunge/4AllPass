name: Desktop installers

# Not on every PR — PyInstaller + Rust release is slow.
# macOS DMG is still built locally (`npm run tauri:build`). This job produces
# Windows NSIS and Linux AppImage on GitHub runners. Not notarized / not SmartScreen.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundle: app
          - name: Windows
            os: windows-latest
            bundle: nsis
          - name: Linux
            os: ubuntu-22.04
            bundle: appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
      - run: npm ci
      - run: npm run build
      - name: Sidecar (PyInstaller local core)
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller
          python scripts/package-sidecar.py
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
      - name: Tauri bundle
        run: npx tauri build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: 4AllPass-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          compression-level: 0
