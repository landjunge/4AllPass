name: Desktop installers

# Not on every PR — PyInstaller + Rust release is slow.
# Tags v* build installers and attach them to a GitHub prerelease.
# Daily cron rebuilds rolling tag `desktop` when main moved.
# Notarization / Authenticode run only when repo secrets are present.
# Without secrets the build stays ad-hoc (right-click Open / SmartScreen).
# Never use `secrets.*` in `if:` — GitHub invalidates the whole file (Unrecognized named-value: secrets).

on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC = 06:00 Berlin (summer). Skips if tag desktop already is this commit.
    - cron: "0 4 * * *"
  push:
    tags: ["v*"]

concurrency:
  group: desktop-installers
  cancel-in-progress: false

# Default token cannot push tags. Release/rolling jobs opt in to contents: write.
# Action refs are full commit SHAs (mutable @v4 tags are not).
permissions:
  contents: read

jobs:
  gate:
    name: New code?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "event $EVENT — always build"
            exit 0
          fi
          git fetch origin "refs/tags/desktop:refs/tags/desktop" --force || true
          HEAD=$(git rev-parse HEAD)
          OLD=$(git rev-parse "desktop^{commit}" 2>/dev/null || true)
          echo "HEAD=$HEAD desktop=$OLD"
          if [ -n "$OLD" ] && [ "$HEAD" = "$OLD" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "tag desktop already is this commit — skip"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "main moved — rebuild desktop"
          fi

  bundle:
    name: ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundle: app
          - name: macOS-Intel
            os: macos-15-intel
            bundle: app
          - name: Windows
            os: windows-latest
            bundle: nsis
          - name: Linux
            os: ubuntu-22.04
            bundle: appimage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Lockfile matches Cargo.toml
        run: cargo fetch --locked
        working-directory: src-tauri
      - name: Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
      - run: npm ci
      - run: npm run build
      - name: Sidecar (PyInstaller local core)
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install --require-hashes -r backend/requirements-sidecar.txt
          python scripts/package-sidecar.py
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret; skip import (ad-hoc)."
            exit 0
          fi
          CERT="$RUNNER_TEMP/apple.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
      - name: Import Windows certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "No WINDOWS_CERTIFICATE secret; skip import (unsigned)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "windows.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $pfx -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force) -CertStoreLocation Cert:\CurrentUser\My
      - name: Tauri bundle
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          # GitHub sets missing secrets to empty. Tauri then runs `security import` and fails.
          # Unset empty vars so the build stays ad-hoc (signingIdentity "-").
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER \
                   TAURI_WINDOWS_SIGNING_CERT; do
            eval "val=\${$v-}"
            if [ -z "$val" ]; then
              unset "$v"
            fi
          done
          npx tauri build --bundles ${{ matrix.bundle }}
      - name: macOS DMG
        if: runner.os == 'macOS'
        run: bash scripts/make-dmg.sh
      - name: Notarize macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "No APPLE_ID secret; skip notarization (Phase A paused)."
            exit 0
          fi
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          test -n "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
      - name: SHA-256 sidecars
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          roots = [
              pathlib.Path("src-tauri/target/release/bundle/dmg"),
              pathlib.Path("src-tauri/target/release/bundle/nsis"),
              pathlib.Path("src-tauri/target/release/bundle/appimage"),
          ]
          for root in roots:
              if not root.is_dir():
                  continue
              for path in root.iterdir():
                  name = path.name
                  if not (name.endswith(".dmg") or name.endswith(".exe") or name.endswith(".AppImage")):
                      continue
                  if name.endswith(".sha256"):
                      continue
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  sidecar = path.with_name(name + ".sha256")
                  sidecar.write_text(f"{digest}  {name}\n", encoding="utf-8")
                  print(f"{name} {digest}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 4AllPass-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sha256
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sha256
          if-no-files-found: warn
          compression-level: 0

  release:
    name: GitHub Release
    needs: [gate, bundle]
    if: ${{ always() && needs.gate.outputs.build == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-cyclonedx
      - run: pip install pip-audit==2.9.0
      - name: Generate CycloneDX SBOMs
        run: bash scripts/generate-sbom.sh sbom
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: List downloaded installers
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: true
          generate_release_notes: false
          body: |
            Desktop alpha. FastAPI never mints provider tokens.

            Signing: see docs/distribution.md. Without Apple/Windows secrets this
            build is ad-hoc (macOS: right-click → Open / scripts/install.sh; Windows: SmartScreen).
            Each installer has a sibling *.sha256; install.sh verifies it.
            CycloneDX SBOMs: sbom-npm.cdx.json, sbom-cargo.cdx.json, sbom-python.cdx.json.

            Unlock with the vault password. WebAuthn PRF in the webview is unproven.
            Loopback broker starts with the app. Not a n8n marketplace node.
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.sha256
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.sha256
            sbom/*.cdx.json
          fail_on_unmatched_files: false

  rolling:
    name: Rolling prerelease
    needs: [gate, bundle]
    if: ${{ always() && needs.gate.outputs.build == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: List downloaded installers
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: desktop
          target_commitish: ${{ github.sha }}
          name: Desktop (rolling)
          prerelease: true
          generate_release_notes: false
          body: |
            Rolling desktop build (manual dispatch or daily 04:00 UTC).
            Not a version tag. Ad-hoc (not notarized).
            install.sh verifies sibling *.sha256.
            Vault folders are never deleted. FastAPI never mints tokens.
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.sha256
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.sha256
          fail_on_unmatched_files: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - name: Point tag desktop at this commit
        run: |
          set -eu
          git tag -f desktop "$GITHUB_SHA"
          git push --force origin "refs/tags/desktop"
          echo "desktop -> $GITHUB_SHA"
