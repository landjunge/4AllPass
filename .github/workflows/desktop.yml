name: Desktop installers

# Not on every PR — PyInstaller + Rust release is slow.
# Explicit dispatch builds immutable candidate artifacts only.
# Historical desktop tag/releases are preserved; publication is a separate verified step.
# Notarization / Authenticode run only when repo secrets are present.
# Without secrets the build stays ad-hoc (right-click Open / SmartScreen).
# Never use `secrets.*` in `if:` — GitHub invalidates the whole file (Unrecognized named-value: secrets).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Select only a failed platform for a targeted rebuild'
        type: choice
        default: all
        options: [all, macOS, macOS-Intel, Windows, Linux]

concurrency:
  group: desktop-installers-${{ inputs.target || 'all' }}
  cancel-in-progress: false

# Default token cannot push tags. Release/rolling jobs opt in to contents: write.
# Action refs are full commit SHAs (mutable @v4 tags are not).
permissions:
  contents: read

jobs:
  gate:
    name: New code?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -eu
          python3 scripts/check-release-license.py
          python3 - <<'PY'
          import json, os
          targets = [
              {"name": "macOS", "os": "macos-latest", "bundle": "app"},
              {"name": "macOS-Intel", "os": "macos-15-intel", "bundle": "app"},
              {"name": "Windows", "os": "windows-latest", "bundle": "nsis"},
              {"name": "Linux", "os": "ubuntu-22.04", "bundle": "appimage"},
          ]
          selected = [t for t in targets if os.environ["REQUESTED_TARGET"] in ("all", t["name"])]
          assert selected, "Unknown platform selection"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": selected}) + "\n")
          PY
          echo "build=true" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Lockfile matches Cargo.toml
        run: cargo fetch --locked
        working-directory: src-tauri
      - name: Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
      - run: npm ci
      - run: npm run build
      - name: Sidecar (PyInstaller local core)
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install --require-hashes -r backend/requirements-sidecar.txt
          python scripts/package-sidecar.py
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
      - name: Isolated packaged sidecar preflight
        run: python scripts/check-release-license.py --sidecar
      - name: Preserve third-party notices
        run: python scripts/collect-release-notices.py
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret; skip import (ad-hoc)."
            exit 0
          fi
          CERT="$RUNNER_TEMP/apple.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
      - name: Import Windows certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "No WINDOWS_CERTIFICATE secret; skip import (unsigned)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "windows.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $pfx -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force) -CertStoreLocation Cert:\CurrentUser\My
      - name: Tauri bundle
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          # GitHub sets missing secrets to empty. Tauri then runs `security import` and fails.
          # Unset empty vars so the build stays ad-hoc (signingIdentity "-").
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER \
                   TAURI_WINDOWS_SIGNING_CERT; do
            eval "val=\${$v-}"
            if [ -z "$val" ]; then
              unset "$v"
            fi
          done
          npx tauri build --bundles ${{ matrix.bundle }}
      - name: macOS DMG
        if: runner.os == 'macOS'
        run: bash scripts/make-dmg.sh
      - name: Notarize macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "No APPLE_ID secret; skip notarization (Phase A paused)."
            exit 0
          fi
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          test -n "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
      - name: Verify license and isolated sidecar startup
        run: python scripts/check-release-license.py --built
      - name: SHA-256 sidecars
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          roots = [
              pathlib.Path("src-tauri/target/release/bundle/dmg"),
              pathlib.Path("src-tauri/target/release/bundle/nsis"),
              pathlib.Path("src-tauri/target/release/bundle/appimage"),
          ]
          import json, subprocess, shutil
          metadata = pathlib.Path("dist/release-metadata")
          metadata.mkdir(parents=True, exist_ok=True)
          shutil.copy2("LICENSE", metadata / "LICENSE")
          platform_name = "${{ matrix.name }}"
          manifest = {"source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                      "version": json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text())["version"],
                      "platform": platform_name,
                      "license_sha256": hashlib.sha256(pathlib.Path("LICENSE").read_bytes()).hexdigest(),
                      "license": "Netzwerkpunkt Personal Use License 1.0",
                      "legal_review": False, "artifacts": []}
          for root in roots:
              if not root.is_dir():
                  continue
              for path in root.iterdir():
                  name = path.name
                  if not (name.endswith(".dmg") or name.endswith(".exe") or name.endswith(".AppImage")):
                      continue
                  if name.endswith(".sha256"):
                      continue
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  sidecar = path.with_name(name + ".sha256")
                  sidecar.write_text(f"{digest}  {name}\n", encoding="utf-8")
                  print(f"{name} {digest}")
                  manifest["artifacts"].append({"name": name, "sha256": digest})
          (metadata / ("source-" + platform_name + ".json")).write_text(json.dumps(manifest, indent=2) + "\n")
          for item in pathlib.Path("dist/release-checks").glob("*.json"):
              shutil.copy2(item, metadata / item.name)

          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 4AllPass-${{ matrix.name }}
          path: |
            dist/release-metadata/*
            dist/third-party-licenses/**
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sha256
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Preserve compact failure diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 4AllPass-diagnostics-${{ matrix.name }}
          path: dist/release-checks/*.json
          if-no-files-found: warn
