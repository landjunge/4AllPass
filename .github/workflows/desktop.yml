name: Desktop installers

# Not on every PR — PyInstaller + Rust release is slow.
# Tags v* build installers and attach them to a GitHub prerelease.
# Notarization / Authenticode run only when repo secrets are present.
# Without secrets the build stays ad-hoc (right-click Open / SmartScreen).
# Never use `secrets.*` in `if:` — GitHub invalidates the whole file (Unrecognized named-value: secrets).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundle: app
          - name: macOS-Intel
            os: macos-15-intel
            bundle: app
          - name: Windows
            os: windows-latest
            bundle: nsis
          - name: Linux
            os: ubuntu-22.04
            bundle: appimage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Lockfile matches Cargo.toml
        run: cargo fetch --locked
        working-directory: src-tauri
      - name: Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
      - run: npm ci
      - run: npm run build
      - name: Sidecar (PyInstaller local core)
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller
          python scripts/package-sidecar.py
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret; skip import (ad-hoc)."
            exit 0
          fi
          CERT="$RUNNER_TEMP/apple.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$APPLE_CERTIFICATE_PASSWORD}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
      - name: Import Windows certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "No WINDOWS_CERTIFICATE secret; skip import (unsigned)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "windows.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $pfx -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force) -CertStoreLocation Cert:\CurrentUser\My
      - name: Tauri bundle
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          # GitHub sets missing secrets to empty. Tauri then runs `security import` and fails.
          # Unset empty vars so the build stays ad-hoc (signingIdentity "-").
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER \
                   TAURI_WINDOWS_SIGNING_CERT; do
            eval "val=\${$v-}"
            if [ -z "$val" ]; then
              unset "$v"
            fi
          done
          npx tauri build --bundles ${{ matrix.bundle }}
      - name: macOS DMG
        if: runner.os == 'macOS'
        run: bash scripts/make-dmg.sh
      - name: Notarize macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "No APPLE_ID secret; skip notarization (Phase A paused)."
            exit 0
          fi
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          test -n "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
      - name: SHA-256 sidecars
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          roots = [
              pathlib.Path("src-tauri/target/release/bundle/dmg"),
              pathlib.Path("src-tauri/target/release/bundle/nsis"),
              pathlib.Path("src-tauri/target/release/bundle/appimage"),
          ]
          for root in roots:
              if not root.is_dir():
                  continue
              for path in root.iterdir():
                  name = path.name
                  if not (name.endswith(".dmg") or name.endswith(".exe") or name.endswith(".AppImage")):
                      continue
                  if name.endswith(".sha256"):
                      continue
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  sidecar = path.with_name(name + ".sha256")
                  sidecar.write_text(f"{digest}  {name}\n", encoding="utf-8")
                  print(f"{name} {digest}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 4AllPass-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sha256
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sha256
          if-no-files-found: warn
          compression-level: 0

  release:
    name: GitHub Release
    needs: bundle
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List downloaded installers
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: false
          body: |
            Desktop alpha. FastAPI never mints provider tokens.

            Signing: see docs/distribution.md. Without Apple/Windows secrets this
            build is ad-hoc (macOS: right-click → Open / scripts/install.sh; Windows: SmartScreen).
            Each installer has a sibling *.sha256; install.sh verifies it.

            Unlock with the vault password. WebAuthn PRF in the webview is unproven.
            Loopback broker starts with the app. Not a n8n marketplace node.
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.sha256
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.sha256
          fail_on_unmatched_files: false

  rolling:
    name: Rolling prerelease
    needs: bundle
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List downloaded installers
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop
          name: Desktop (rolling)
          prerelease: true
          generate_release_notes: false
          body: |
            Rolling desktop build from workflow_dispatch. Not a version tag.
            Ad-hoc (not notarized). install.sh verifies sibling *.sha256.
            Vault folders are never deleted. FastAPI never mints tokens.
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.sha256
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.sha256
          fail_on_unmatched_files: false
