# Deploy product site (site/) to GitHub Pages
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_configured: ${{ steps.pages.outputs.configured }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          status="$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages")"

          if [ "$status" = "200" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for $REPO. Skipping deploy. Enable once: Settings → Pages → Source: GitHub Actions."
          else
            cat /tmp/pages.json
            echo "::error::Unexpected response while checking GitHub Pages configuration: HTTP $status"
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.pages.outputs.configured == 'true'
      # Avoid upload-pages-artifact's nested mutable upload-artifact@v4.
      - name: Archive Pages artifact
        if: steps.pages.outputs.configured == 'true'
        run: bash scripts/package-pages.sh site "$RUNNER_TEMP/artifact.tar"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.pages.outputs.configured == 'true'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    if: needs.build.outputs.pages_configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

