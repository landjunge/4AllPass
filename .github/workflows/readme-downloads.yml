name: Refresh README downloads
on:
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_readme_downloads.py
      - .github/workflows/readme-downloads.yml
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: readme-downloads
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check updater rules
        run: python3 -I scripts/update_readme_downloads.py --self-test
      - name: Refresh verified download links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          # main is branch-protected (required checks), so the bot cannot push to it.
          # Publish the refresh on a bot branch, open/update one PR, run the required CI
          # on that branch (workflow_dispatch is the one event GITHUB_TOKEN may start)
          # and let auto-merge land it once the required checks pass.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet origin "$BASE_BRANCH"
          git reset --quiet --hard "origin/$BASE_BRANCH"
          python3 -I scripts/update_readme_downloads.py
          git add README.md README.de.md assets/readme/download-*.svg
          unexpected=$(git diff --cached --name-only | grep -v -E '^(README(\.de)?\.md|assets/readme/download-[a-z0-9-]+\.svg)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes: $unexpected" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Download buttons already current."
            exit 0
          fi
          # GitHub's API fails transiently ("Something went wrong", 502); retry each call.
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 15))
            done
            return 1
          }
          branch=automation/readme-downloads
          git commit --quiet -m "docs: refresh download buttons"
          git push --quiet --force origin "HEAD:refs/heads/$branch"
          pr=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number -q '.[0].number // empty')
          if [ -z "$pr" ]; then
            retry gh pr create --base "$BASE_BRANCH" --head "$branch" \
              --title "docs: refresh download buttons" \
              --body "Automatic refresh of the download buttons (generated files only)."
            pr=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number -q '.[0].number')
          fi
          retry gh workflow run ci.yml --ref "$branch"
          # Workflow runs started by a PR that the bot opened wait for approval
          # (status action_required) and keep the PR blocked. Approve them, like a
          # maintainer clicking "Approve and run".
          sleep 15
          for run in $(gh run list --branch "$branch" --event pull_request --status action_required --json databaseId -q '.[].databaseId'); do
            retry gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve" >/dev/null
          done
          retry gh pr merge "$pr" --auto --squash
