name: Refresh README downloads
# Keeps the AUTO-DOWNLOADS buttons in README.md pointing at the newest published
# release files. Same script in KiraBridge, ThreadDesk and 4AllPass; only the
# runner and the way the change reaches main differ.
#  - release events: immediate refresh after publishing, editing or deleting
#  - schedule: safety net for files uploaded after the release was published
#  - push of the updater itself: proves a changed updater on main right away
# main is protected by required checks, so the change goes through a bot pull
# request that starts those checks itself and merges automatically once they pass.
on:
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_readme_downloads.py
      - .github/workflows/readme-downloads.yml
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: readme-downloads
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the updater rules
        run: python3 -I scripts/update_readme_downloads.py --self-test
      - name: Refresh, verify and propose with automatic merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scheduled events carry no repository payload; main is the default branch.
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          branch=automation/readme-downloads
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Always regenerate on the newest main so the proposal is up to date
          # (main requires branches to be current before merging).
          git fetch --quiet origin "$BASE_BRANCH"
          git reset --quiet --hard "origin/$BASE_BRANCH"
          python3 -I scripts/update_readme_downloads.py
          git add -A
          # Only generated files may be committed; anything else stops the job.
          unexpected=$(git diff --cached --name-only \
            | grep -v -E '^(README(\.de)?\.md|assets/readme/download-[a-z0-9-]+\.svg)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes, nothing committed: $unexpected" >&2
            exit 1
          fi
          open=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if git diff --cached --quiet; then
            echo "Download buttons on main are already current."
            if [ -n "$open" ]; then
              gh pr close "$open" --delete-branch \
                --comment "main already shows the current download buttons."
            fi
            exit 0
          fi
          git switch --quiet -C "$branch"
          git commit --quiet -m "docs: refresh download buttons"
          # Dedicated bot branch: a rerun replaces its previous proposal.
          git push --quiet --force origin "$branch"
          if [ -z "$open" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$branch" \
              --title "docs: refresh download buttons" \
              --body "Generated from the published release assets; every link was verified before this commit. Merges automatically when the required checks pass."
          fi
          # Pull requests opened with GITHUB_TOKEN start no workflows, so start
          # the required checks explicitly on the bot branch.
          gh workflow run ci.yml --ref "$branch"
          gh pr merge "$branch" --auto --squash --delete-branch
          echo "Proposed refreshed download buttons; automatic merge after required checks."
