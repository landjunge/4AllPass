name: Verify README downloads
# READMEs are maintained with tested product changes, not by a bot PR.
# Published-release link freshness is checked; this workflow never commits,
# opens PRs, changes the design, or overrides branch protection.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - README.de.md
      - scripts/update_readme_downloads.py
      - .github/workflows/readme-downloads.yml
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readme-downloads-verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify updater logic
        run: python3 -I scripts/update_readme_downloads.py --self-test
      - name: Check published-download references without changing GitHub
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I scripts/update_readme_downloads.py
          if ! git diff --quiet -- README.md README.de.md assets/readme; then
            echo "::error::README download references are outdated. Update and integrate them with the corresponding tested code/release; preserve existing design."
            git diff --stat -- README.md README.de.md assets/readme
            exit 1
          fi
          echo "README download references match published assets."
