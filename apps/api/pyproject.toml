[project]
name = "fourallpass-api"
version = "0.1.0"
description = "4AllPass FastAPI backend — stores opaque envelopes, never vault keys"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.40",
  "alembic>=1.15.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.8.0",
  "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
