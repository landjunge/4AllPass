# Product landing only. Not the vault. No FastAPI.
# Document root: /srv/netzwerkpunkt/4allpass/landing
# Certbot: certbot --nginx -d 4allpass.netzwerkpunkt.de

server {
    listen 443 ssl;
    server_name 4allpass.netzwerkpunkt.de;
    root /srv/netzwerkpunkt/4allpass/landing;
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /api {
        return 404;
    }
    location /api/ {
        return 404;
    }
    location /health {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name 4allpass.netzwerkpunkt.de;
    return 301 https://$host$request_uri;
}
