# Vault endpoint only. Compose project 4allpass-vault on 127.0.0.1:8000/8080.
# Certbot: certbot --nginx -d vault.4allpass.netzwerkpunkt.de
# Landing is 4allpass.netzwerkpunkt.de — different origin, no /api there.

server {
    listen 443 ssl;
    server_name vault.4allpass.netzwerkpunkt.de;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name vault.4allpass.netzwerkpunkt.de;
    return 301 https://$host$request_uri;
}
