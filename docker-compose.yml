services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fourallpass
      POSTGRES_PASSWORD: fourallpass
      POSTGRES_DB: fourallpass
    ports:
      - "5432:5432"
    volumes:
      - fourallpass_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  fourallpass_pg:
