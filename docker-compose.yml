# Development only. Not production. Do not publish this file as a deployment.
# Postgres and Redis stay on the compose network — they are not published to the host.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fourallpass
      POSTGRES_PASSWORD: fourallpass
      POSTGRES_DB: fourallpass
    expose:
      - "5432"
    volumes:
      - fourallpass-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourallpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      FOURALLPASS_DATABASE_URL: postgresql+asyncpg://fourallpass:fourallpass@postgres:5432/fourallpass
      FOURALLPASS_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  fourallpass-postgres-data:
