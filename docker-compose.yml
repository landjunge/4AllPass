services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fourallpass
      POSTGRES_PASSWORD: fourallpass
      POSTGRES_DB: fourallpass
    ports:
      - "5432:5432"
    volumes:
      - fourallpass-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourallpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      FOURALLPASS_DATABASE_URL: ******postgres:5432/fourallpass
      FOURALLPASS_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  fourallpass-postgres-data:
