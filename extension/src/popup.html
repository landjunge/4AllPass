<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>4AllPass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1><img src="icons/logo.png" alt="4AllPass" /></h1>
    <p id="status" class="muted">Gesperrt. Entschlüsselung bleibt auf diesem Gerät. / Locked. Decryption stays on this device.</p>
    <form id="unlock">
      <label>API <input id="api" value="http://127.0.0.1:8010" /></label>
      <label>E-mail <input id="email" type="email" autocomplete="username" required /></label>
      <label>Sign-in password <input id="account" type="password" autocomplete="current-password" required /></label>
      <label>Vault password <input id="vault" type="password" required /></label>
      <button type="submit" id="unlock-btn">Unlock</button>
    </form>
    <div id="unlocked" hidden>
      <button type="button" id="fill">Fill this page</button>
      <p class="muted" id="shortcut">Ctrl+Shift+L · right-click the page · locks after 5 min idle</p>
      <ul id="picks"></ul>
      <button type="button" id="lock" class="link">Lock</button>
    </div>
    <p id="error" class="error" hidden></p>
    <script src="popup.js"></script>
  </body>
</html>
