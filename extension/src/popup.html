<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>4AllPass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1><img src="icons/logo.png" alt="4AllPass" /></h1>
    <p id="status" class="muted">Gesperrt. Entschlüsselung bleibt auf diesem Gerät. / Locked. Decryption stays on this device.</p>
    <form id="unlock">
      <label>API <input id="api" value="http://127.0.0.1:8788" /></label>
      <label
        >Tresor-Passwort / Vault password
        <input id="vault" type="password" required autocomplete="current-password"
      /></label>
      <p class="hint">
        Desktop-App: nur dieses Passwort. / Desktop app: this password only.
      </p>
      <details id="server-account">
        <summary>Server-Konto (optional) / Server account</summary>
        <label>E-mail <input id="email" type="email" autocomplete="username" /></label>
        <label
          >Konto-Passwort / Sign-in password
          <input id="account" type="password" autocomplete="current-password"
        /></label>
      </details>
      <button type="submit" id="unlock-btn">Entsperren / Unlock</button>
    </form>
    <div id="unlocked" hidden>
      <button type="button" id="fill">Diese Seite füllen / Fill this page</button>
      <button type="button" id="assist" hidden>Trotzdem füllen / Fill anyway</button>
      <div id="suggest-box" hidden>
        <p id="suggest"></p>
        <button type="button" id="suggest-accept">Auswählen / Choose</button>
        <button type="button" id="suggest-deny" class="link">Abbrechen / Cancel</button>
      </div>
      <p class="muted" id="shortcut">Ctrl+Shift+L · ⌘⇧L · Rechtsklick / right-click · 5 min idle</p>
      <ul id="picks"></ul>
      <button type="button" id="lock" class="link">Sperren / Lock</button>
    </div>
    <p id="error" class="error" hidden></p>
    <script src="popup.js"></script>
  </body>
</html>
