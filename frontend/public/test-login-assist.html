<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Assist fill fixture · 4AllPass</title>
  </head>
  <body>
    <h1>Weak username + password</h1>
    <p>
      <code>name=q</code> is under 0.70. Password is eligible. Assist may fill the text field after an
      explicit click. Not a search-box-only fill.
    </p>
    <form id="login" action="#" method="post">
      <label>Query <input id="q" name="q" type="text" /></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
