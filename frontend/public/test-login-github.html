<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in to GitHub · 4AllPass fixture</title>
  </head>
  <body>
    <h1>Sign in to GitHub</h1>
    <p>
      Fixture shaped like <code>github.com/login</code> (2026-08): one form, username +
      current-password, plus a hidden honeypot. Conditional UI may set
      <code>autocomplete="username webauthn"</code>. Not a multi-step engine. No submit off this
      origin.
    </p>
    <form id="login" action="#" method="post">
      <label>
        Username or email address
        <input
          id="login_field"
          name="login"
          type="text"
          autocomplete="username webauthn"
        />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" />
      </label>
      <input type="text" name="required_field_test" hidden="hidden" />
      <button type="submit">Sign in</button>
    </form>
    <p id="result"></p>
    <script>
      document.getElementById("login").addEventListener("submit", (event) => {
        event.preventDefault();
        const user = document.getElementById("login_field").value;
        const pass = document.getElementById("password").value;
        document.getElementById("result").textContent = user && pass ? `submitted ${user}` : "empty";
      });
    </script>
  </body>
</html>
