<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>4AllPass login test</title>
  </head>
  <body>
    <h1>Demo login</h1>
    <p>Classic: username + current-password. Signup below must <strong>not</strong> fill.</p>
    <form id="login" action="#" method="post">
      <label>Username <input id="username" name="username" autocomplete="username" /></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
    </form>
    <input id="trap-opacity" name="trap_email" type="email" autocomplete="username" style="opacity: 0; position: absolute" />
    <input
      id="trap-tiny"
      name="trap_user"
      type="text"
      autocomplete="username"
      style="width: 1px; height: 1px; position: absolute; left: -9999px"
    />
    <input id="trap-aria" name="trap_login" type="text" autocomplete="username" aria-hidden="true" />
    <dialog id="trap-dialog">
      <input id="trap-dialog-user" name="trap_dialog_user" type="text" autocomplete="username" />
      <input id="trap-dialog-pass" name="trap_dialog_pass" type="password" autocomplete="current-password" />
    </dialog>
    <div inert>
      <input id="trap-inert" name="trap_inert" type="text" autocomplete="username" />
    </div>
    <h2>GitHub-shaped (name=login, id=login_field)</h2>
    <form id="github-login" action="#" method="post">
      <label>Username or email <input id="login_field" name="login" type="text" /></label>
      <label>Password <input id="github-password" name="password" type="password" /></label>
      <button type="submit">Sign in</button>
    </form>
    <h2>Email login</h2>
    <form id="email-login" action="#" method="post">
      <label>Email <input id="email" name="email" type="email" autocomplete="email" /></label>
      <label>Password <input id="email-password" name="password" type="password" autocomplete="current-password" /></label>
      <button type="submit">Continue</button>
    </form>
    <h2>Signup (must not fill password)</h2>
    <form id="signup" action="#" method="post">
      <label>Name <input id="given" name="user" autocomplete="given-name" /></label>
      <label>New password <input id="new-pass" name="new" type="password" autocomplete="new-password" /></label>
      <button type="submit">Create account</button>
    </form>
    <p id="result"></p>
    <script>
      document.getElementById("login").addEventListener("submit", (event) => {
        event.preventDefault();
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        document.getElementById("result").textContent = user && pass ? `submitted ${user}` : "empty";
      });
    </script>
  </body>
</html>
