[package]
name = "fourallpass"
version = "0.1.0"
description = "4AllPass desktop shell — UI is this webview, not a browser tab"
authors = ["landjunge"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "fourallpass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
